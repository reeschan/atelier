name: lens-review

# Reviews pull requests opened by the repository owner with the lens-review
# plugin (https://github.com/reeschan/claude-plugins-official) and posts the
# verified findings to the pull request.
#
# Runs only when the pull request's author is `reeschan` and its branch lives in
# this repository. Pull requests from other authors or from forks skip the job,
# so the API key is never handed to their code.
#
# Secret: ANTHROPIC_API_KEY (Anthropic Console API key).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: lens-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lens-review:
    if: >-
      github.event.pull_request.user.login == 'reeschan' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allow_fork_prs: "false"
          plugin_marketplaces: https://github.com/reeschan/claude-plugins-official.git
          plugins: lens-review@reeschan-plugins
          prompt: |
            /lens-review:lens-review ${{ github.event.pull_request.number }} --comment
            Base: ${{ github.event.pull_request.base.sha }}
            Target: ${{ github.event.pull_request.head.sha }}

            この PR は push のたびにレビューし直す。投稿の付録の「「## lens-review」で始まるまとめのコメントがもうある」は、そのコメントに今の head の SHA (${{ github.event.pull_request.head.sha }}) が書かれているときだけ当てはめる。まとめのコメントには、1 行目の「## lens-review」の次の行に `head: ${{ github.event.pull_request.head.sha }}` を書く。
          claude_args: >-
            --model sonnet
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git fetch:*),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git ls-files:*)"
