<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PBI Template Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 配色と字体は今の画面から引き継ぐ。外部の読み込みはしない (字体は端末のものに落ちる)。 */
:root {
  --ground: #e9edf5;
  --blob-a: #ffb38a;
  --blob-b: #8fb4ff;
  --blob-c: #b7f0d8;
  --glass: rgba(255, 255, 255, 0.55);
  --glass-strong: rgba(255, 255, 255, 0.78);
  --glass-edge: rgba(255, 255, 255, 0.9);
  --line: rgba(40, 52, 80, 0.12);
  --ink: #1c2233;
  --ink-soft: #55607a;
  --accent: #3a5bd9;
  --accent-ink: #ffffff;
  --perf: #c2410c;
  --cost: #0f7a55;
  --bal: #3a5bd9;
  --warn: #a15c00;
  --shadow: 0 10px 40px rgba(30, 40, 80, 0.12);
  --f-display: "Unbounded", "Zen Kaku Gothic New", system-ui, sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0c1020; --blob-a: #7a2e18; --blob-b: #1f3a8a; --blob-c: #0d5a44;
    --glass: rgba(22, 28, 48, 0.52); --glass-strong: rgba(28, 35, 60, 0.82); --glass-edge: rgba(255, 255, 255, 0.14);
    --line: rgba(220, 230, 255, 0.12); --ink: #eef1fb; --ink-soft: #a3acc6; --accent: #8aa4ff; --accent-ink: #0c1020;
    --perf: #ff9a6b; --cost: #5fe0ac; --bal: #8aa4ff; --warn: #ffc163; --shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0c1020; --blob-a: #7a2e18; --blob-b: #1f3a8a; --blob-c: #0d5a44;
  --glass: rgba(22, 28, 48, 0.52); --glass-strong: rgba(28, 35, 60, 0.82); --glass-edge: rgba(255, 255, 255, 0.14);
  --line: rgba(220, 230, 255, 0.12); --ink: #eef1fb; --ink-soft: #a3acc6; --accent: #8aa4ff; --accent-ink: #0c1020;
  --perf: #ff9a6b; --cost: #5fe0ac; --bal: #8aa4ff; --warn: #ffc163; --shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { max-width: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 15px/1.65 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  min-height: 100%;
  overflow-x: hidden;
}
.field { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.field i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .75; animation: drift 26s ease-in-out infinite alternate; }
.field i:nth-child(1) { width: 46vw; height: 46vw; left: -10vw; top: -8vw; background: var(--blob-a); }
.field i:nth-child(2) { width: 52vw; height: 52vw; right: -14vw; top: 18vh; background: var(--blob-b); animation-delay: -8s; }
.field i:nth-child(3) { width: 40vw; height: 40vw; left: 22vw; bottom: -16vw; background: var(--blob-c); animation-delay: -15s; }
@keyframes drift { to { transform: translate(4vw, 3vh) scale(1.08); } }
@media (prefers-reduced-motion: reduce) { .field i { animation: none; } }

.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 22px; min-width: 0; }
.glass {
  background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 22px;
  backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
  box-shadow: var(--shadow); min-width: 0;
}
header.top { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; justify-content: space-between; }
h1 { font: 700 clamp(24px, 4.4vw, 40px)/1.1 var(--f-display); letter-spacing: -.01em; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
h1 small { display: block; font: 500 13px/1.4 var(--f-body); color: var(--ink-soft); letter-spacing: .02em; margin-top: 8px; }
h2 { font: 500 19px/1.3 var(--f-display); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
h3 { font: 500 15px/1.3 var(--f-display); margin: 0; overflow-wrap: anywhere; }
h4 { font: 500 13.5px/1.3 var(--f-body); margin: 0; overflow-wrap: anywhere; }
p { margin: 0; }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { border: 1px solid var(--glass-edge); background: var(--glass-strong); border-radius: 999px; padding: 8px 16px; font-weight: 500; font-size: 13.5px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { color: var(--warn); border-color: currentColor; }
.btn.small { padding: 5px 12px; font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass-strong); font-size: 12px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.pill.warn { color: var(--warn); border-color: currentColor; }
.muted { color: var(--ink-soft); font-size: 12.5px; }
.mono { font-family: var(--f-mono); overflow-wrap: anywhere; }
.warn-text { color: var(--warn); font-size: 12.5px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-soft); }
/* 長い home のパスで header が広がらないよう、flex の子が縮めるようにする */
.wrap > *, header.top > *, .meta, .meta > * { min-width: 0; max-width: 100%; }
.sep { color: var(--line); }

.notice { padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass-strong); font-size: 13px; overflow-wrap: anywhere; }
.notice.ok { color: var(--cost); border-color: currentColor; }
.notice.err { color: var(--warn); border-color: currentColor; }
.warnings { color: var(--warn); font-size: 12.5px; border: 1px solid currentColor; border-radius: 12px; padding: 10px 14px; overflow-wrap: anywhere; }
.warnings ul { margin: 4px 0 0; padding-left: 1.2em; }

.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { border: 1px solid var(--glass-edge); background: var(--glass); border-radius: 999px; padding: 9px 18px; font-weight: 500; font-size: 13.5px; max-width: 100%; overflow-wrap: anywhere; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

.panel { display: grid; gap: 16px; min-width: 0; }
.panel-head { display: grid; gap: 6px; }
.panel-head p { color: var(--ink-soft); font-size: 13.5px; max-width: 72ch; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; min-width: 0; }
.bar .hint { color: var(--ink-soft); font-size: 12px; overflow-wrap: anywhere; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 16px; min-width: 0; }
.card { padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; min-width: 0; }
.card-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
.card-title b { font-size: 15.5px; overflow-wrap: anywhere; }
.card-title .muted { display: block; font-size: 11px; }
.mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font: 700 16px/1 var(--f-display); color: #fff; flex: none; background: var(--accent); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 4px 14px rgba(0,0,0,.18); }
.mark.opencode { background: #4d6bfe; }
.mark.codex { background: #10a37f; }
.mark.agy { background: #d97757; }
.mark.dsh { background: #7c5cff; }
.mark.claude { background: #c96442; }
.mark.agent { background: #3a5bd9; }
.switch { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.switch input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

.field-row { display: grid; gap: 3px; font-size: 12px; color: var(--ink-soft); min-width: 0; }
input[type="text"], input[type="search"], input[type="date"], input[type="datetime-local"], select, textarea {
  font: 13px var(--f-body); color: var(--ink); background: var(--glass-strong);
  border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px;
  min-width: 0; max-width: 100%; width: 100%;
}
textarea { min-height: 58px; resize: vertical; }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; flex: none; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; align-items: end; min-width: 0; }
.fields .wide { grid-column: 1 / -1; }
.fields.two { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.search { margin-bottom: 2px; }

.model-list { display: grid; gap: 8px; max-height: 430px; overflow-y: auto; overflow-x: hidden; padding-right: 2px; }
.model-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 9px; align-items: start; padding: 8px 9px; border: 1px solid var(--line); border-radius: 12px; background: var(--glass-strong); cursor: pointer; min-width: 0; }
.model-row input { margin-top: 3px; }
.model-body { display: grid; gap: 2px; min-width: 0; }
.model-name { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.model-id { font: 11px var(--f-mono); color: var(--ink-soft); overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.tag { font: 11px var(--f-mono); border: 1px solid var(--line); border-radius: 7px; padding: 0 6px; color: var(--ink-soft); }
.tag.manual { border-color: var(--accent); color: var(--accent); }
.tag.muted-tag { border-style: dashed; }
.badge { font: 600 10.5px var(--f-mono); border: 1px solid var(--warn); color: var(--warn); border-radius: 6px; padding: 0 5px; }
.ref { font-size: 11.5px; color: var(--ink-soft); overflow-wrap: anywhere; }
.manual-form { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }

.tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr)); gap: 16px; min-width: 0; }
.tier-col { padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.tier-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.tier-name { font: 500 15px/1.3 var(--f-display); overflow-wrap: anywhere; }
.tier-head code { font: 11.5px var(--f-mono); color: var(--ink-soft); }
.tier-head .switch { margin-left: auto; }
.steps { display: grid; gap: 8px; min-width: 0; }
.step { display: grid; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 13px; background: var(--glass-strong); min-width: 0; }
.step.agent { border-color: var(--accent); }
.step-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 110px), 1fr)); gap: 8px; min-width: 0; }
.step-actions { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.icon { border: 1px solid var(--line); background: transparent; border-radius: 8px; min-width: 28px; height: 27px; font-size: 12px; line-height: 1; color: var(--ink-soft); }
.icon:hover:not(:disabled) { border-color: var(--accent); color: var(--ink); }
.icon:disabled { opacity: .3; cursor: default; }
.add-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.add-row select { flex: 1 1 150px; width: auto; }
.agent-step { display: grid; gap: 6px; border-top: 1px dashed var(--line); padding-top: 10px; }
.agent-label { font: 600 11px/1.3 var(--f-mono); letter-spacing: .04em; color: var(--accent); text-transform: uppercase; }
.rotate { display: grid; gap: 8px; padding: 10px; border: 1px dashed var(--accent); border-radius: 13px; min-width: 0; }
.rotate-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.rotate-head b { font-size: 12px; color: var(--accent); overflow-wrap: anywhere; }

.priority-top { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; min-width: 0; }
.list { display: grid; gap: 6px; min-width: 0; }
.list-item { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--glass-strong); min-width: 0; }
.list-item.active { border-color: var(--accent); }
.list-body { display: grid; gap: 1px; min-width: 0; flex: 1 1 140px; }
.list-body b { overflow-wrap: anywhere; }
.link { border: 0; background: transparent; padding: 0; font-weight: 600; text-align: left; color: var(--accent); overflow-wrap: anywhere; }
.editor-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.sub-block { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.opus-warn { color: var(--warn); border: 1px solid currentColor; border-radius: 12px; padding: 10px 12px; font-size: 12.5px; }
.app-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; margin: 0; }
.app-grid dt { font-size: 11px; color: var(--ink-soft); }
.app-grid dd { margin: 0; overflow-wrap: anywhere; }
.app-grid .wide { grid-column: 1 / -1; }

.flow-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; min-width: 0; }
.flow-row { display: grid; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 13px; background: var(--glass-strong); min-width: 0; }
.flow-row.fallback { border-style: dashed; }
.flow-row-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; justify-content: space-between; min-width: 0; }
.flow-row-head b { font-size: 13px; overflow-wrap: anywhere; }
.flow-row .field-row select { font-size: 12.5px; padding: 5px 8px; }
.gate-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; justify-content: space-between; }
.gate-head .field-row { flex: 1 1 150px; }

footer { font-size: 12px; color: var(--ink-soft); }
@media (max-width: 560px) {
  .tab { flex: 1 1 auto; text-align: center; padding: 8px 12px; font-size: 12.5px; }
  .card { padding: 14px; }
  .glass { border-radius: 18px; }
  h2 { font-size: 17px; }
}
</style>
</head>
<body>
<div class="field" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="wrap">
  <header class="top">
    <h1>Template Studio<small data-i18n="tagline"></small></h1>
    <div class="meta">
      <span class="pill" id="homePill"></span>
      <button class="btn" id="reload" type="button" data-i18n="reload"></button>
      <button class="btn" id="lang" type="button"></button>
      <button class="btn" id="close" type="button" data-i18n="close"></button>
    </div>
  </header>

  <div id="notice" class="notice" role="status" hidden></div>
  <div id="warnings" class="warnings" hidden></div>

  <nav class="tabs" role="tablist" aria-label="Studio">
    <button class="tab" id="tab-agents" type="button" role="tab" aria-controls="panel-agents" aria-selected="true" data-i18n="tabAgents"></button>
    <button class="tab" id="tab-routing" type="button" role="tab" aria-controls="panel-routing" aria-selected="false" data-i18n="tabRouting"></button>
    <button class="tab" id="tab-priority" type="button" role="tab" aria-controls="panel-priority" aria-selected="false" data-i18n="tabPriority"></button>
    <button class="tab" id="tab-flow" type="button" role="tab" aria-controls="panel-flow" aria-selected="false" data-i18n="tabFlow"></button>
  </nav>

  <main>
    <section id="panel-agents" class="panel" role="tabpanel" aria-labelledby="tab-agents">
      <div class="panel-head">
        <h2 data-i18n="agentsTitle"></h2>
        <p data-i18n="agentsIntro"></p>
      </div>
      <div id="agents-cards" class="cards"></div>
    </section>

    <section id="panel-routing" class="panel" role="tabpanel" aria-labelledby="tab-routing" hidden>
      <div class="panel-head">
        <h2 data-i18n="routingTitle"></h2>
        <p data-i18n="routingIntro"></p>
      </div>
      <div class="bar">
        <span class="pill" id="routingSource"></span>
        <span class="hint" id="routingHint"></span>
        <button class="btn primary" id="saveRouting" type="button" data-i18n="save"></button>
      </div>
      <div id="routing-tiers" class="tiers"></div>
    </section>

    <section id="panel-priority" class="panel" role="tabpanel" aria-labelledby="tab-priority" hidden>
      <div class="panel-head">
        <h2 data-i18n="priorityTitle"></h2>
        <p data-i18n="priorityIntro"></p>
      </div>
      <div class="priority-top">
        <section class="glass card">
          <h3 data-i18n="templatesTitle"></h3>
          <div id="template-list" class="list"></div>
          <div class="bar"><button class="btn" id="newTemplate" type="button" data-i18n="newTemplate"></button></div>
        </section>
        <section class="glass card">
          <h3 data-i18n="examplesTitle"></h3>
          <div id="example-list" class="list"></div>
          <label class="field-row"><span data-i18n="copyAs"></span><input id="copyAs" type="text" autocomplete="off"></label>
        </section>
      </div>
      <section class="glass card">
        <div id="template-editor"></div>
      </section>
      <section class="glass card">
        <h3 data-i18n="applicationTitle"></h3>
        <div id="application"></div>
      </section>
    </section>

    <section id="panel-flow" class="panel" role="tabpanel" aria-labelledby="tab-flow" hidden>
      <div class="panel-head">
        <h2 data-i18n="flowTitle"></h2>
        <p data-i18n="flowIntro"></p>
      </div>
      <div id="flow-body" class="panel"></div>
    </section>
  </main>

  <footer data-i18n="footer"></footer>
</div>

<script type="application/json" id="studio-boot"></script>

    return value === 'ja' ? 'ja' : 'en';

    const source = (TEXT[lang] && TEXT[lang][key]) || TEXT.ja[key] || key;
    return String(source).replace(/\{(\d)\}/g, (_, i) => (args[+i] === undefined ? '' : args[+i]));
  };

  const isObject = (value) => !!value && typeof value === 'object' && !Array.isArray(value);
  const cap = (value) => value.charAt(0).toUpperCase() + value.slice(1);

  function fmtTime(iso) {
    if (!iso) return t('never');
    const date = new Date(iso);
    if (isNaN(date.getTime())) return String(iso);
    try { return date.toLocaleString(lang === 'ja' ? 'ja-JP' : 'en-US'); } catch (_) { return String(iso); }
  }

  function isoLocal(value) {
    const date = new Date(value);
    if (isNaN(date.getTime())) return null;
    const pad = (n) => String(n).padStart(2, '0');
    const offset = -date.getTimezoneOffset();
    const sign = offset >= 0 ? '+' : '-';
    const abs = Math.abs(offset);
    return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) +
      'T' + pad(date.getHours()) + ':' + pad(date.getMinutes()) + ':00' +
      sign + pad(Math.floor(abs / 60)) + ':' + pad(abs % 60);
  }

  const state = {
    data: null,
    tab: 'agents',

  function initialTab() {
    const hash = (location.hash || '').replace(/^#/, '');
    return TABS.indexOf(hash) >= 0 ? hash : 'agents';
  }

  let noticeTimer = null;
  function notice(message, kind) {
    const el = $('notice');
    if (!el) return;
    const type = kind || 'ok';
    el.textContent = message || '';
    el.className = 'notice ' + type;
    el.hidden = !message;
    clearTimeout(noticeTimer);
    if (message) noticeTimer = setTimeout(() => { el.hidden = true; }, type === 'err' ? 9000 : 5000);
  }

  function run(fn) {
    Promise.resolve().then(fn).catch((error) => notice(error && error.message ? error.message : String(error), 'err'));
  }

  async function request(method, path, body) {
    const headers = { 'X-Studio-Token': boot.token };
    const init = { method: method, headers: headers, cache: 'no-store' };
    if (body !== undefined) {
      headers['Content-Type'] = 'application/json';
      init.body = JSON.stringify(body);
    }
    let response;
    try {
      response = await fetch(path, init);
    } catch (error) {
      throw new Error(t('netFail', error && error.message ? error.message : String(error)));
    }
    let payload = null;
    try { payload = await response.json(); } catch (_) { payload = null; }
    if (response.status === 403) throw new Error(t('errToken'));
    if (!response.ok) throw new Error((payload && payload.error) || t('errHttp', response.status));
    if (method !== 'GET' && (!payload || payload.ok !== true)) {
      throw new Error((payload && payload.error) || t('errHttp', response.status));
    }
    return payload;
  }

    return state.data && state.data.runners ? state.data.runners[runner] : null;
  }

  function agentChoices() {
    const runner = runnerState('agent');
    if (!runner) return [];
    const list = runner.models && Array.isArray(runner.models.list) ? runner.models.list : [];
    const byId = new Map(list.map((model) => [model.id, model]));
    const ids = runner.selected === null
      ? list.map((model) => model.id)
      : (Array.isArray(runner.selected) ? runner.selected.slice() : []);
    const seen = new Set();
    const out = [];
    for (const id of ids) {
      if (seen.has(id)) continue;
      seen.add(id);
      const model = byId.get(id);
      out.push({
        id: id,
        name: (model && model.name) || id,
        efforts: (model && Array.isArray(model.efforts)) ? model.efforts : [],
      });
    }
    return out;
  }

  function choicesFor(runner) {
    if (runner === 'agent') return agentChoices();
    const info = runnerState(runner);
    if (!info || !info.enabled) return [];
    const list = info.models && Array.isArray(info.models.list) ? info.models.list : [];
    const byId = new Map(list.map((model) => [model.id, model]));
    const ids = info.selected === null
      ? list.map((model) => model.id)
      : (Array.isArray(info.selected) ? info.selected.slice() : []);
    const seen = new Set();
    const out = [];
    for (const id of ids) {
      if (seen.has(id)) continue;
      seen.add(id);
      const model = byId.get(id);
      out.push({
        id: id,
        name: (model && model.name) || id,
        efforts: (model && Array.isArray(model.efforts)) ? model.efforts : [],
      });
    }
    return out;
  }

  function combos(includeAgent) {
    const runners = includeAgent ? RUNNERS : EXTERNAL;
    const out = [];
    for (const runner of runners) {
      if (runner === 'agent' && !includeAgent) continue;
      const info = runnerState(runner);
      if (runner !== 'agent' && (!info || !info.enabled)) continue;
      for (const model of choicesFor(runner)) {
        const efforts = model.efforts.length ? model.efforts : [null];
        for (const effort of efforts) {
          out.push({
            runner: runner,
            model: model.id,
            effort: effort,
            label: RUNNER_LABEL[runner] + ' ' + model.name + (effort ? ' · ' + effort : ''),
          });
        }
      }
    }
    return out;
  }

  const externalCombos = () => combos(false);
  const allCombos = () => combos(true);
  const defaultAgentModel = () => (agentChoices()[0] || { id: '' }).id;

  function normalizeRouting() {
    if (!state.routing || !isObject(state.routing.tiers)) {
      state.routing = { name: 'mine', tiers: {} };

    const tiers = state.routing.tiers;
    for (const tier of TIERS) {
      if (!Array.isArray(tiers[tier])) tiers[tier] = [];
      const steps = tiers[tier];
      const agentAt = steps.findIndex((step) => isObject(step) && step.runner === 'agent');
      if (agentAt >= 0 && agentAt !== steps.length - 1) {
        const agent = steps.splice(agentAt, 1)[0];
        steps.push(agent);
      }
      if (!steps.length || !isObject(steps[steps.length - 1]) || steps[steps.length - 1].runner !== 'agent') {
        steps.push({ runner: 'agent', model: defaultAgentModel(), effort: null });
      }
      for (let i = steps.length - 2; i >= 0; i -= 1) {
        if (isObject(steps[i]) && steps[i].runner === 'agent') steps.splice(i, 1);
      }
    }
  }

  // --- エージェントとモデル ---

  function mark(runner) {
    return { opencode: 'O', codex: 'C', agy: 'A', dsh: 'D', claude: 'H', agent: '★' }[runner] || '?';
  }

  function modelRow(runner, model, checked) {
    const ref = model.ref;
    const bits = [];
    if (ref) {
      if (ref.quality !== null && ref.quality !== undefined) bits.push(esc(t('quality')) + ' ' + esc(ref.quality));
      const prices = [];
      if (ref.price_in !== null && ref.price_in !== undefined) prices.push('$' + esc(ref.price_in));
      if (ref.price_out !== null && ref.price_out !== undefined) prices.push('$' + esc(ref.price_out));
      if (prices.length) bits.push(esc(t('price')) + ' ' + prices.join(' / '));
      if (ref.sample) bits.push('<span class="badge">' + esc(t('sample')) + '</span>');
      if (ref.source === 'cli') bits.push(esc(t('refCli')));
    } else {
      bits.push(esc(t('noRef')));
    }
    const efforts = Array.isArray(model.efforts) && model.efforts.length
      ? model.efforts.map((effort) => '<span class="tag">' + esc(effort) + '</span>').join('')
      : '<span class="tag muted-tag">' + esc(t('noEfforts')) + '</span>';
    return '<label class="model-row" data-search="' +
      esc((String(model.name || '') + ' ' + model.id + ' ' + (model.efforts || []).join(' ')).toLowerCase()) + '">' +
      '<input type="checkbox" data-role="model" data-runner="' + esc(runner) + '" data-id="' + esc(model.id) + '"' + (checked ? ' checked' : '') + '>' +
      '<span class="model-body">' +
      '<span class="model-name">' + esc(model.name || model.id) + '</span>' +
      '<span class="model-id">' + esc(model.id) + '</span>' +
      '<span class="tags">' + efforts + (model.manual ? '<span class="tag manual">' + esc(t('manualTag')) + '</span>' : '') + '</span>' +
      '<span class="ref">' + bits.join(' · ') + '</span>' +
      '</span></label>';
  }

  function runnerCard(runner) {
    const info = runnerState(runner) || {};
    const agent = runner === 'agent';
    const models = info.models;
    const list = models && Array.isArray(models.list) ? models.list : [];
    const selected = info.selected;
    const isOn = (id) => (selected === null ? true : (Array.isArray(selected) && selected.indexOf(id) >= 0));
    const metaBits = [];
    if (info.path) metaBits.push('<span class="mono">' + esc(info.path) + '</span>');
    if (info.version) metaBits.push(esc(t('version')) + ' ' + esc(info.version));
    if (info.checked_at) metaBits.push(esc(t('checkedAt')) + ' ' + esc(fmtTime(info.checked_at)));
    if (info.billing) metaBits.push(esc(t('billing')) + ' ' + esc(info.billing));
    const fetchLine = !models
      ? '<p class="muted">' + esc(t('noModels')) + '</p>'
      : '<p class="muted">' + esc(t('fetchedAt')) + ': ' + esc(fmtTime(models.fetched_at)) + (models.method ? ' · ' + esc(models.method) : '') + '</p>' +
        (models.error ? '<p class="warn-text">' + esc(t('fetchError')) + ': ' + esc(models.error) +
          (models.failed_at ? ' (' + esc(t('failedAt')) + ' ' + esc(fmtTime(models.failed_at)) + ')' : '') + '</p>' : '');
    const missing = Array.isArray(info.missing_selected) && info.missing_selected.length
      ? '<p class="warn-text">' + esc(t('missing', info.missing_selected.join(', '))) + '</p>' : '';
    const switchHtml = '<label class="switch"><input type="checkbox" data-role="enabled" data-runner="' + esc(runner) + '"' +
      (info.enabled ? ' checked' : '') + (agent ? ' disabled' : '') + '><span>' + esc(agent ? t('agentAlways') : t('enabled')) + '</span></label>';
    const rows = list.length
      ? list.map((model) => modelRow(runner, model, isOn(model.id))).join('')
      : '<p class="muted">' + esc(t('noModelList')) + '</p>';
    const search = '<label class="field-row search"><span>' + esc(t('searchModels')) + '</span>' +
      '<input type="search" data-role="search" data-runner="' + esc(runner) + '" value="' +
      esc(state.search[runner] || '') + '" placeholder="' + esc(t('searchPlaceholder')) + '" autocomplete="off"></label>';
    const manual = '<form class="manual-form" data-role="manual" data-runner="' + esc(runner) + '">' +
      '<h4>' + esc(t('manualTitle')) + '</h4>' +
      '<div class="fields">' +
      '<label class="field-row"><span>' + esc(t('modelId')) + '</span><input type="text" data-role="new-id" autocomplete="off" spellcheck="false"></label>' +
      '<label class="field-row"><span>' + esc(t('effortsLabel')) + '</span><input type="text" data-role="new-efforts" autocomplete="off" placeholder="low, high"></label>' +
      '<button class="btn" type="submit">' + esc(t('addModel')) + '</button>' +
      '</div><p class="muted">' + esc(t('addModelHint')) + '</p></form>';
    return '<article class="card glass" data-runner="' + esc(runner) + '">' +
      '<div class="card-head">' +
      '<div class="card-title"><span class="mark ' + esc(runner) + '">' + esc(mark(runner)) + '</span>' +
      '<div><b>' + esc(RUNNER_LABEL[runner]) + '</b><span class="muted">' + esc(runner) + '</span></div></div>' +
      switchHtml + '</div>' +
      '<div class="meta">' + metaBits.join('<span class="sep">·</span>') + '</div>' +
      fetchLine + missing +
      (list.length ? search : '') +
      '<div class="model-list">' + rows + '</div>' +
      '<p class="muted no-hit" hidden>' + esc(t('noHit')) + '</p>' +
      manual + '</article>';
  }

  function renderAgents() {
    const box = $('agents-cards');
    if (!state.data) { box.innerHTML = '<p class="muted">' + esc(t('loading')) + '</p>'; return; }
    box.innerHTML = RUNNERS.map((runner) => runnerCard(runner)).join('');
    for (const runner of RUNNERS) {
      if (state.search[runner]) {
        const card = box.querySelector('[data-runner="' + runner + '"].card');
        if (card) filterModels(card, state.search[runner]);
      }
    }

  function filterModels(card, query) {
    const needle = String(query || '').trim().toLowerCase();
    let visible = 0;
    card.querySelectorAll('.model-row').forEach((row) => {
      const hit = !needle || (row.dataset.search || '').indexOf(needle) >= 0;
      row.hidden = !hit;
      if (hit) visible += 1;
    });
    const empty = card.querySelector('.no-hit');
    if (empty) empty.hidden = visible > 0;
  }

  // --- 振り分けテンプレート ---

  function posAttrs(opts) {
    const member = (opts.member === null || opts.member === undefined) ? '' : ' data-member="' + opts.member + '"';
    return ' data-tier="' + esc(opts.tier) + '" data-index="' + opts.index + '"' + member;
  }

  function renderStep(step, opts) {
    step = step || {};
    const force = opts.forceRunner || null;
    const pos = posAttrs(opts);
    let allowed = [];
    if (force) {
      allowed = [force];
    } else {
      const candidates = opts.allowAgent ? RUNNERS : EXTERNAL;
      for (const runner of candidates) {
        if (runner === 'agent') {
          if (opts.allowAgent) allowed.push(runner);
          continue;
        }
        const info = runnerState(runner);
        if (info && info.enabled) allowed.push(runner);
      }
      if (step.runner && allowed.indexOf(step.runner) < 0) allowed.unshift(step.runner);
    }
    const runner = force || step.runner || allowed[0] || '';
    const choices = runner ? choicesFor(runner) : [];
    const modelIds = choices.map((choice) => choice.id);
    const model = step.model || modelIds[0] || '';
    if (model && modelIds.indexOf(model) < 0) modelIds.unshift(model);
    const modelField = modelIds.length
      ? '<select data-role="model"' + pos + '>' + modelIds.map((id) =>
        '<option value="' + esc(id) + '"' + (id === model ? ' selected' : '') + '>' + esc(id) + '</option>').join('') + '</select>'
      : '<input type="text" data-role="model"' + pos + ' value="' + esc(step.model || '') + '" autocomplete="off" spellcheck="false">';
    const chosen = choices.find((choice) => choice.id === model);
    const efforts = chosen ? chosen.efforts.slice() : [];
    if (step.effort && efforts.indexOf(step.effort) < 0) efforts.unshift(step.effort);
    const effortField = '<select data-role="effort"' + pos + '><option value="">' + esc(t('noEfforts')) + '</option>' +
      efforts.map((effort) => '<option value="' + esc(effort) + '"' + (effort === step.effort ? ' selected' : '') + '>' + esc(effort) + '</option>').join('') +
      '</select>';
    const runnerField = force ? '' : (allowed.length
      ? '<label class="field-row"><span>' + esc(t('runnerLabel')) + '</span><select data-role="runner"' + pos + '>' +
        allowed.map((name) => '<option value="' + esc(name) + '"' + (name === runner ? ' selected' : '') + '>' + esc(RUNNER_LABEL[name] || name) + '</option>').join('') +
        '</select></label>'
      : '<label class="field-row"><span>' + esc(t('runnerLabel')) + '</span><input type="text" data-role="runner"' + pos + ' value="' + esc(step.runner || '') + '" autocomplete="off"></label>');
    const untilField = opts.noUntil ? '' : '<label class="field-row"><span>' + esc(t('untilLabel')) + '</span>' +
      '<input type="date" data-role="until"' + pos + ' value="' + esc(step.until || '') + '"></label>';
    const actions = force ? '' : '<div class="step-actions">' +
      '<button class="icon" type="button" data-act="up"' + pos + ' aria-label="' + esc(t('up')) + '"' + (opts.canUp ? '' : ' disabled') + '>↑</button>' +
      '<button class="icon" type="button" data-act="down"' + pos + ' aria-label="' + esc(t('down')) + '"' + (opts.canDown ? '' : ' disabled') + '>↓</button>' +
      '<button class="icon" type="button" data-act="del"' + pos + ' aria-label="' + esc(t('remove')) + '"' + (opts.canRemove ? '' : ' disabled') + '>×</button>' +
      '</div>';
    return '<div class="step' + (force ? ' agent' : '') + '"' + pos + '>' +
      '<div class="step-fields">' + runnerField +
      '<label class="field-row"><span>' + esc(t('modelLabel')) + '</span>' + modelField + '</label>' +
      '<label class="field-row"><span>' + esc(t('effortLabel')) + '</span>' + effortField + '</label>' +
      untilField + '</div>' + actions + '</div>';
  }

  function routingTier(tier) {
    const steps = state.routing.tiers[tier] || [];
    const external = steps.slice(0, -1);
    const agentStep = steps[steps.length - 1] || { runner: 'agent', model: defaultAgentModel(), effort: null };
    const options = externalCombos();
    const addSelect = options.length
      ? '<select data-role="add-choice" data-tier="' + esc(tier) + '">' +
        options.map((combo, i) => '<option value="' + i + '">' + esc(combo.label) + '</option>').join('') + '</select>'
      : '<span class="muted">' + esc(t('noChoice')) + '</span>';
    const body = external.map((step, i) => renderStep(step, {
      tier: tier, index: i, allowAgent: false, noUntil: false,
      canUp: i > 0, canDown: i < external.length - 1, canRemove: true,
    })).join('');
    return '<section class="tier-col glass">' +
      '<div class="tier-head"><span class="tier-name">' + esc(t('tier' + cap(tier))) + '</span><code>' + esc(tier) + '</code></div>' +
      '<div class="steps">' + body + '</div>' +
      '<div class="add-row">' + addSelect +
      '<button class="btn" type="button" data-act="add-routing-step" data-tier="' + esc(tier) + '"' + (options.length ? '' : ' disabled') + '>' + esc(t('addStep')) + '</button></div>' +
      '<div class="agent-step"><span class="agent-label">' + esc(t('agentLast')) + '</span>' +
      renderStep(agentStep, { tier: tier, index: steps.length - 1, forceRunner: 'agent', noUntil: true }) +
      '</div></section>';
  }

  function renderRouting() {
    const box = $('routing-tiers');
    if (!state.data) { box.innerHTML = '<p class="muted">' + esc(t('loading')) + '</p>'; return; }
    if (!state.routing) { state.routing = clone(state.data.routing.table); normalizeRouting(); }
    const source = state.data.routing.source;
    $('routingSource').textContent = source === 'default' ? t('routingDefault') : t('routingHome');
    $('routingSource').className = 'pill' + (source === 'default' ? ' warn' : '');
    $('routingHint').textContent = source === 'default' ? t('routingDefaultHint') : t('routingHomeHint');

  function templateRotate(group, tier, index, count) {
    const members = Array.isArray(group.rotate) ? group.rotate : [];
    const body = members.map((step, member) => renderStep(step, {
      tier: tier, index: index, member: member, allowAgent: false, noUntil: false,
      canUp: member > 0, canDown: member < members.length - 1, canRemove: members.length > 2,
    })).join('');
    return '<div class="rotate" data-tier="' + esc(tier) + '" data-index="' + index + '">' +
      '<div class="rotate-head"><b>' + esc(t('rotateTitle')) + '</b><div class="step-actions">' +
      '<button class="icon" type="button" data-act="group-up" data-tier="' + esc(tier) + '" data-index="' + index + '" aria-label="' + esc(t('up')) + '"' + (index > 0 ? '' : ' disabled') + '>↑</button>' +
      '<button class="icon" type="button" data-act="group-down" data-tier="' + esc(tier) + '" data-index="' + index + '" aria-label="' + esc(t('down')) + '"' + (index < count - 1 ? '' : ' disabled') + '>↓</button>' +
      '<button class="icon" type="button" data-act="group-del" data-tier="' + esc(tier) + '" data-index="' + index + '" aria-label="' + esc(t('remove')) + '"' + (count > 1 ? '' : ' disabled') + '>×</button>' +
      '</div></div><div class="steps">' + body + '</div>' +
      '<button class="btn small" type="button" data-act="add-member" data-tier="' + esc(tier) + '" data-index="' + index + '">' + esc(t('addMember')) + '</button></div>';
  }

  function templateTier(tier, draft) {
    const used = Object.prototype.hasOwnProperty.call(draft.tiers, tier);
    const steps = used && Array.isArray(draft.tiers[tier]) ? draft.tiers[tier] : [];
    const toggle = '<label class="switch"><input type="checkbox" data-role="tier-toggle" data-tier="' + esc(tier) + '"' +
      (used ? ' checked' : '') + '><span>' + esc(t('useTier')) + '</span></label>';
    const head = '<div class="tier-head"><span class="tier-name">' + esc(t('tier' + cap(tier))) + '</span><code>' + esc(tier) + '</code>' + toggle + '</div>';
    if (!used) return '<section class="tier-col glass">' + head + '</section>';
    const options = allCombos();
    const external = externalCombos();
    const body = steps.map((item, index) => {
      if (isObject(item) && Array.isArray(item.rotate)) return templateRotate(item, tier, index, steps.length);
      return renderStep(item, {
        tier: tier, index: index, allowAgent: true, noUntil: false,
        canUp: index > 0, canDown: index < steps.length - 1, canRemove: steps.length > 1,
      });
    }).join('');
    const addSelect = options.length
      ? '<select data-role="add-choice" data-tier="' + esc(tier) + '">' +

        '<label class="switch"><input type="checkbox" data-role="app-forever"' + (state.app.forever ? ' checked' : '') + '><span>' + esc(t('forever')) + '</span></label>' +
        '<label class="field-row"><span>' + esc(t('appOnExpire')) + '</span><select data-role="app-on-expire">' +
        '<option value="ask"' + (state.app.on_expire === 'ask' ? ' selected' : '') + '>' + esc(t('onExpireAsk')) + '</option>' +
        '<option value="drop"' + (state.app.on_expire === 'drop' ? ' selected' : '') + '>' + esc(t('onExpireDrop')) + '</option></select></label>' +
        '<label class="field-row wide"><span>' + esc(t('appReason')) + '</span><input type="text" data-role="app-reason" value="' + esc(state.app.reason || '') + '" autocomplete="off"></label>' +
        '<button class="btn primary" type="button" data-act="apply">' + esc(t('apply')) + '</button>' +
        '</div>' + (hasOpus ? '<p class="opus-warn">' + esc(t('opusWarn')) + '</p>' : '') + '</div>'
      : '<p class="muted">' + esc(t('noTemplateToApply')) + '</p>';
    const answer = application
      ? '<div class="sub-block"><h4>' + esc(t('answerTitle')) + '</h4><div class="fields">' +
        '<label class="field-row"><span>' + esc(t('appUntil')) + '</span><input type="datetime-local" data-role="answer-until" value="' + esc(state.answerUntil || '') + '"></label>' +
        '<button class="btn" type="button" data-act="answer-extend">' + esc(t('extend')) + '</button>' +
        '<button class="btn" type="button" data-act="answer-forever">' + esc(t('forever')) + '</button>' +
        '<button class="btn danger" type="button" data-act="answer-stop">' + esc(t('stop')) + '</button>' +
        '</div></div>'
      : '';
    box.innerHTML = details + applyForm + answer;
  }

  function renderPriority() {
    renderTemplateList();
    renderExampleList();
    renderTemplateEditor();
    renderApplication();
  }

  // --- 編集操作 ---

  function findStep(scope, tier, index, member) {
    const table = scope === 'routing' ? state.routing : state.template;
    if (!table || !table.tiers) return null;
    const steps = table.tiers[tier];
    if (!Array.isArray(steps)) return null;
    const item = steps[index];
    if (!item) return null;
    if (member === null || member === undefined) return { step: item, list: steps, index: index };
    if (!Array.isArray(item.rotate)) return null;
    const step = item.rotate[member];
    if (!step) return null;
    return { step: step, list: item.rotate, index: member, group: item };
  }

  function applyStepChange(step, role, el) {
    if (role === 'runner') {
      step.runner = el.value;
      const choices = choicesFor(step.runner);
      step.model = choices.length ? choices[0].id : '';
      step.effort = null;
    } else if (role === 'model') {
      step.model = el.value;
      const choices = choicesFor(step.runner);
      const chosen = choices.find((choice) => choice.id === el.value);
      if (!chosen || chosen.efforts.indexOf(step.effort) < 0) step.effort = null;
    } else if (role === 'effort') {
      step.effort = el.value === '' ? null : el.value;
    } else if (role === 'until') {
      if (el.value) step.until = el.value;
      else delete step.until;
    }
  }

  function moveRoutingStep(tier, index, delta) {
    const steps = state.routing.tiers[tier];
    const bound = steps.length - 1;
    const to = index + delta;
    if (index < 0 || index >= bound || to < 0 || to >= bound) return;
    const item = steps.splice(index, 1)[0];
    steps.splice(to, 0, item);
    renderRouting();
  }

  function addMember(tier, index) {
    const group = state.template.tiers[tier][index];
    if (!group || !Array.isArray(group.rotate)) return;
    const choices = externalCombos();
    const source = choices[0] || group.rotate[group.rotate.length - 1];
    if (!source) return;
    group.rotate.push({ runner: source.runner, model: source.model, effort: source.effort });
    renderPriority();
  }

  function saveTemplate() {
    run(async () => {
      const draft = state.template;
      if (!draft) return;
      const name = String(draft.name || '').trim();
      if (!/^[a-z0-9][a-z0-9-]{0,62}$/.test(name)) throw new Error(t('needName'));
      const tiers = {};
      for (const tier of TIERS) {
        if (!Object.prototype.hasOwnProperty.call(draft.tiers, tier)) continue;
        const steps = draft.tiers[tier];
        if (!Array.isArray(steps) || !steps.length) throw new Error(t('tierNeedsStep'));
        tiers[tier] = clone(steps);
      }
      if (!Object.keys(tiers).length) throw new Error(t('needTier'));
      const body = { name: name, description: String(draft.description || ''), tiers: tiers };
      if (draft.$schema_note) body.$schema_note = draft.$schema_note;
      await request('PUT', '/api/templates/' + encodeURIComponent(name), body);
      const old = state.templateOriginal;
      if (old && old !== name) await request('DELETE', '/api/templates/' + encodeURIComponent(old));
      state.templateOriginal = name;
      await refresh();
      state.template = clone(state.data.templates[name] || body);
      renderPriority();
      notice(t('templateSaved', name), 'ok');
    });
  }

  function applyNow() {
    run(async () => {
      if (!state.app.template) throw new Error(t('noTemplateToApply'));
      let until = null;
      if (!state.app.forever) {
        until = isoLocal(state.app.until);
        if (!until) throw new Error(t('needUntil'));
      }
      const result = await request('PUT', '/api/application', {
        template: state.app.template,
        until: until,
        on_expire: state.app.on_expire,
        reason: String(state.app.reason || ''),
      });
      await refresh();
      if (result.opus_override) notice(t('appliedOpus', state.app.template), 'err');
      else notice(t('applied', state.app.template), 'ok');
    });
  }

  function answer(choice) {
    run(async () => {
      const body = { choice: choice };
      if (choice === 'extend') {
        const until = isoLocal(state.answerUntil);
        if (!until) throw new Error(t('needUntil'));
        body.until = until;
      }
      await request('POST', '/api/application/answer', body);
      state.answerUntil = '';
      await refresh();
      notice(t('answered'), 'ok');
    });
  }

  // --- 開発フロー ---

  const flowInfo = () => (state.data && state.data.flow) || null;
  const entryId = (item) => (typeof item === 'string' ? item : (isObject(item) ? item.id : null));
  const entryWhen = (item) => (isObject(item) && typeof item.when === 'string' ? item.when : '');
  const titleOf = (component, cid) => (component && component.title && (component.title[lang] || component.title.ja)) || cid;

  // 読み直したあと、選んでいるテンプレートが無ければ既定 (無ければ先頭) を選び、下書きが無ければ作る
  function syncFlow() {
    const info = flowInfo();
    if (!info) return;
    const names = Object.keys(info.workflows || {});
    const flow = state.flow;
    if (flow.isNew && flow.draft) return;
    if (!flow.name || names.indexOf(flow.name) < 0) {
      flow.name = names.indexOf(info.default) >= 0 ? info.default : (names[0] || null);
      flow.draft = null;
    }
    if (!flow.draft && flow.name) loadFlowDraft(flow.name);
  }

  function loadFlowDraft(name) {
    const info = flowInfo();
    const entry = info && info.workflows ? info.workflows[name] : null;
    state.flow.name = name;
    state.flow.isNew = false;
    state.flow.draft = entry && entry.data ? clone(entry.data) : null;
    if (state.flow.draft) normalizeFlow(state.flow.draft);
  }

  function normalizeFlow(draft) {
    const info = flowInfo();
    if (!isObject(draft.stages)) draft.stages = {};
    for (const stage of info.stages) if (!Array.isArray(draft.stages[stage])) draft.stages[stage] = [];
    if (!Array.isArray(draft.gates)) draft.gates = [];
    if (!Array.isArray(draft.optional)) draft.optional = [];
    if (!isObject(draft.fix)) draft.fix = { max_rework: 2 };
    if (!isObject(draft.build)) draft.build = { external_memory: 'none' };
    if (!isObject(draft.description)) draft.description = { ja: '', en: '' };
  }

  function whenSelect(item, perPbi, attrs) {
    const info = flowInfo();
    const component = info.components[entryId(item)];
    const current = entryWhen(item);
    const values = info.when.filter((value) => perPbi || info.per_pbi_when.indexOf(value) < 0 || value === current);
    const options = ['<option value="">' + esc(t('flowWhenDefault', component ? component.when : '?')) + '</option>']
      .concat(values.map((value) => '<option value="' + esc(value) + '"' + (value === current ? ' selected' : '') + '>' + esc(value) + '</option>'));
    return '<label class="field-row"><span>' + esc(t('flowWhen')) + '</span><select data-role="flow-when"' + attrs + '>' + options.join('') + '</select></label>';
  }

  function flowRow(item, index, count, place, perPbi) {
    const info = flowInfo();
    const cid = entryId(item);
    const component = info.components[cid];
    const attrs = ' data-place="' + esc(place) + '" data-index="' + index + '"';
    const tags = component
      ? [component.kind, component.where, 'memory ' + component.memory, 'cost ' + component.cost]
        .map((tag) => '<span class="tag">' + esc(tag) + '</span>').join('') +
        (component.source === 'home' ? '<span class="tag manual">' + esc(t('flowSourceTagHome')) + '</span>' : '')
      : '<span class="badge">unknown</span>';
    return '<div class="flow-row' + (component && component.fallback ? ' fallback' : '') + '">' +
      '<div class="flow-row-head"><b>' + esc(titleOf(component, cid)) + '</b><span class="model-id">' + esc(cid) + '</span></div>' +
      '<div class="tags">' + tags + '</div>' +
      whenSelect(item, perPbi, attrs) +
      '<div class="step-actions">' +
      '<button class="icon" type="button" data-act="flow-up"' + attrs + (index === 0 ? ' disabled' : '') + ' aria-label="' + esc(t('up')) + '">↑</button>' +
      '<button class="icon" type="button" data-act="flow-down"' + attrs + (index === count - 1 ? ' disabled' : '') + ' aria-label="' + esc(t('down')) + '">↓</button>' +
      '<button class="icon" type="button" data-act="flow-del"' + attrs + ' aria-label="' + esc(t('remove')) + '">✕</button>' +
      '</div></div>';
  }

  function flowAddRow(place, role, items) {
    const info = flowInfo();
    const used = new Set(items.map(entryId));
    const ids = Object.keys(info.components).filter((cid) => info.components[cid].stages.indexOf(role) >= 0 && !used.has(cid)).sort();
    if (!ids.length) return '<p class="muted">' + esc(t('flowNoAdd')) + '</p>';
    return '<div class="add-row"><select data-role="flow-add-choice" aria-label="' + esc(t('flowAdd')) + '">' +
      ids.map((cid) => '<option value="' + esc(cid) + '">' + esc(titleOf(info.components[cid], cid)) + ' (' + esc(cid) + ')</option>').join('') +
      '</select><button class="btn small" type="button" data-act="flow-add" data-place="' + esc(place) + '">' + esc(t('flowAdd')) + '</button></div>';
  }

  function flowList(place) {
    const draft = state.flow.draft;
    if (place.indexOf('gate:') === 0) {
      const gate = draft.gates[Number(place.slice(5))];
      return gate ? gate.components : null;
    }
    if (place.indexOf('opt:') === 0) {
      const step = optionalStep(place.slice(4));
      return step ? step.components : null;
    }
    return draft.stages[place] || null;
  }

  function optionalStep(stage) {
    return state.flow.draft.optional.find((step) => isObject(step) && step.stage === stage) || null;
  }

  function renderFlowOptional(stage) {
    const info = flowInfo();
    const step = optionalStep(stage);
    const on = '<label class="field-row"><span>' + esc(t('flowOptionalOn')) + '</span><input type="checkbox" data-role="flow-opt-on" data-stage="' + esc(stage) + '"' + (step ? ' checked' : '') + '></label>';
    let body = '';
    if (step) {
      const place = 'opt:' + stage;
      const items = Array.isArray(step.components) ? step.components : (step.components = []);
      body = '<label class="field-row"><span>' + esc(t('flowGateAfter')) + '</span><select data-role="flow-opt-after" data-stage="' + esc(stage) + '">' +
        info.optional_places.map((s) => '<option value="' + esc(s) + '"' + (s === step.after ? ' selected' : '') + '>' + esc(t('stage_' + s)) + ' (' + esc(s) + ')</option>').join('') +
        '</select></label>' +
        '<div class="steps">' + items.map((item, i) => flowRow(item, i, items.length, place, false)).join('') + '</div>' +
        (items.length ? '' : '<p class="warn-text">' + esc(t('flowEmptyStage')) + '</p>') +
        flowAddRow(place, stage, items);
    }
    return '<section class="glass tier-col">' +
      '<div class="tier-head"><span class="tier-name">' + esc(t('stage_' + stage)) + '</span><code>' + esc(stage) + '</code></div>' +
      '<div class="gate-head">' + on + '</div>' + body + '</section>';
  }

  function renderFlowStage(stage) {
    const info = flowInfo();
    const items = state.flow.draft.stages[stage];
    const last = items.length ? info.components[entryId(items[items.length - 1])] : null;
    const warn = !items.length ? t('flowEmptyStage') : (last && !last.fallback ? t('flowLastFallback') : '');
    return '<section class="glass tier-col">' +
      '<div class="tier-head"><span class="tier-name">' + esc(t('stage_' + stage)) + '</span><code>' + esc(stage) + '</code></div>' +
      '<div class="steps">' + items.map((item, i) => flowRow(item, i, items.length, stage, false)).join('') + '</div>' +
      (warn ? '<p class="warn-text">' + esc(warn) + '</p>' : '') +
      flowAddRow(stage, stage, items) + '</section>';
  }

  function renderFlowGate(gate, index) {
    const info = flowInfo();
    const place = 'gate:' + index;
    const items = Array.isArray(gate.components) ? gate.components : (gate.components = []);
    const after = '<label class="field-row"><span>' + esc(t('flowGateAfter')) + '</span><select data-role="flow-gate-after" data-index="' + index + '">' +
      info.stages.map((stage) => '<option value="' + esc(stage) + '"' + (stage === gate.after ? ' selected' : '') + '>' + esc(t('stage_' + stage)) + ' (' + esc(stage) + ')</option>').join('') +
      '</select></label>';
    return '<section class="glass tier-col">' +
      '<div class="gate-head">' + after +
      '<button class="btn small danger" type="button" data-act="flow-del-gate" data-index="' + index + '">' + esc(t('flowRemoveGate')) + '</button></div>' +
      '<div class="steps">' + items.map((item, i) => flowRow(item, i, items.length, place, gate.after === 'route')).join('') + '</div>' +
      (items.length ? '' : '<p class="warn-text">' + esc(t('flowEmptyStage')) + '</p>') +
      flowAddRow(place, 'gate', items) + '</section>';
  }

  function renderFlow() {
    const box = $('flow-body');
    const info = flowInfo();
    if (!info) { box.innerHTML = '<p class="muted">' + esc(t('loading')) + '</p>'; return; }
    const flow = state.flow;
    const names = Object.keys(info.workflows).sort();
    if (flow.isNew && names.indexOf(flow.name) < 0) names.push(flow.name);
    if (!names.length) { box.innerHTML = '<p class="muted">' + esc(t('flowNone')) + '</p>'; return; }
    const entry = info.workflows[flow.name] || null;
    const source = flow.isNew ? t('flowSourceNew') : (entry && entry.source === 'home' ? t('flowSourceHome') : t('flowSourceBundled'));
    const pick = '<label class="field-row"><span>' + esc(t('flowPick')) + '</span><select data-role="flow-pick">' +
      names.map((name) => '<option value="' + esc(name) + '"' + (name === flow.name ? ' selected' : '') + '>' + esc(name) + '</option>').join('') +
      '</select></label>';
    const copy = '<label class="field-row"><span>' + esc(t('flowCopyAs')) + '</span><input type="text" data-role="flow-copy-as" value="' + esc(flow.copyAs) + '" autocomplete="off" spellcheck="false"></label>' +
      '<button class="btn" type="button" data-act="flow-copy">' + esc(t('flowCopyBtn')) + '</button>';
    const canDelete = !flow.isNew && entry && entry.source === 'home';
    const actions = '<div class="bar"><span class="pill">' + esc(source) + '</span>' +
      '<button class="btn primary" type="button" data-act="flow-save"' + (flow.draft ? '' : ' disabled') + '>' + esc(t('flowSave')) + '</button>' +
      '<button class="btn" type="button" data-act="flow-reset">' + esc(t('reset')) + '</button>' +
      (canDelete ? '<button class="btn danger" type="button" data-act="flow-delete">' + esc(entry.bundled ? t('flowDeleteHome') : t('flowDeleteNew')) + '</button>' : '') +
      '</div>';
    const errorList = (title, list) => (list && list.length
      ? '<div class="warnings"><b>' + esc(title) + '</b><ul>' + list.map((e) => '<li>' + esc(e) + '</li>').join('') + '</ul></div>' : '');
    let html = '<section class="glass card"><div class="fields two">' + pick + '<div class="add-row">' + copy + '</div></div>' + actions +
      (entry && entry.path && !flow.isNew ? '<p class="muted mono">' + esc(entry.path) + '</p>' : '') + '</section>' +
      errorList(t('flowComponentErrors'), info.errors) +
      errorList(t('flowErrors'), !flow.isNew && entry ? entry.errors : []);
    const draft = flow.draft;
    if (!draft) { box.innerHTML = html; return; }
    html += '<section class="glass card"><div class="fields two">' +
      '<label class="field-row"><span>' + esc(t('flowDescJa')) + '</span><textarea data-role="flow-desc" data-lang="ja">' + esc(draft.description.ja || '') + '</textarea></label>' +
      '<label class="field-row"><span>' + esc(t('flowDescEn')) + '</span><textarea data-role="flow-desc" data-lang="en">' + esc(draft.description.en || '') + '</textarea></label>' +
      '</div></section>';
    html += '<div class="flow-grid">' + info.stages.map(renderFlowStage).join('') + '</div>';
    html += '<section class="glass card"><div class="editor-head"><h3>' + esc(t('flowGates')) + '</h3>' +
      '<button class="btn small" type="button" data-act="flow-add-gate">' + esc(t('flowAddGate')) + '</button></div>' +
      '<p class="muted">' + esc(t('flowGatesIntro')) + '</p></section>';
    html += '<div class="flow-grid">' + draft.gates.map(renderFlowGate).join('') + '</div>';
    html += '<section class="glass card"><h3>' + esc(t('flowOptional')) + '</h3>' +
      '<p class="muted">' + esc(t('flowOptionalIntro')) + '</p></section>';
    html += '<div class="flow-grid">' + info.optional.map(renderFlowOptional).join('') + '</div>';
    const [low, high] = info.max_rework;
    const rework = [];
    for (let n = low; n <= high; n += 1) rework.push('<option value="' + n + '"' + (n === draft.fix.max_rework ? ' selected' : '') + '>' + n + '</option>');
    html += '<section class="glass card"><h3>' + esc(t('flowSettings')) + '</h3><div class="fields two">' +
      '<label class="field-row"><span>' + esc(t('flowMaxRework')) + '</span><select data-role="flow-rework">' + rework.join('') + '</select></label>' +
      '<label class="field-row"><span>' + esc(t('flowExternalMemory')) + '</span><select data-role="flow-memory">' +
      info.external_memory.map((value) => '<option value="' + esc(value) + '"' + (value === draft.build.external_memory ? ' selected' : '') + '>' + esc(value) + '</option>').join('') +
      '</select></label></div></section>';
    box.innerHTML = html;
  }

  function saveFlow() {
    run(async () => {
      const flow = state.flow;
      if (!flow.draft || !flow.name) return;
      const body = clone(flow.draft);
      body.name = flow.name;
      // 入れていないオプションの工程は書かない (空の optional も残さない)
      body.optional = (body.optional || []).filter((step) => isObject(step) && Array.isArray(step.components) && step.components.length);
      if (!body.optional.length) delete body.optional;
      try {
        await request('PUT', '/api/workflows/' + encodeURIComponent(flow.name), body);
      } catch (error) {
        notice(t('saveFail', error.message || String(error)), 'err');
        return;
      }
      flow.isNew = false;
      flow.draft = null;
      await refresh();
      notice(t('flowSaved', flow.name), 'ok');
    });
  }

  function setTab(tab, updateHash) {
    state.tab = TABS.indexOf(tab) >= 0 ? tab : 'agents';
    if (updateHash !== false) {
      try { history.replaceState(null, '', '#' + state.tab); } catch (_) {}
    }
    renderChrome();
    renderPanel();
  }

  function bind() {
    for (const tab of TABS) {
      $('tab-' + tab).addEventListener('click', () => setTab(tab));
    }
    $('lang').addEventListener('click', () => {
      lang = lang === 'ja' ? 'en' : 'ja';
      store.set('studio-lang', lang);
      renderStatic();
      renderAll();
    });
    $('reload').addEventListener('click', () => run(async () => {
      state.routing = null;
      state.flow.draft = null;
      state.flow.isNew = false;
      await refresh();
      if (state.templateOriginal && state.data.templates[state.templateOriginal]) {
        state.template = clone(state.data.templates[state.templateOriginal]);
      }
      renderPriority();
      notice(t('reloaded'), 'ok');
    }));
    $('close').addEventListener('click', () => run(async () => {
      await request('POST', '/api/close');
      notice(t('closeOk'), 'ok');
    }));
    $('newTemplate').addEventListener('click', () => {
      state.template = { name: '', description: '', tiers: {} };
      state.templateOriginal = null;
      renderPriority();
    });
    $('saveRouting').addEventListener('click', () => run(async () => {
      if (!state.routing) return;
      try {
        await request('PUT', '/api/routing', state.routing);
      } catch (error) {
        notice(t('saveFail', error.message || String(error)), 'err');
        return;
      }
      state.routing = null;
      await refresh();
      notice(t('routingSaved'), 'ok');
    }));
    $('copyAs').addEventListener('input', (event) => { state.copyAs = event.target.value; });

    $('panel-agents').addEventListener('change', (event) => {
      const el = event.target;
      if (!el || !el.dataset) return;
      if (el.dataset.role === 'enabled') {
        run(async () => {
          const runner = el.dataset.runner;
          await request('PUT', '/api/agents/' + encodeURIComponent(runner), { enabled: el.checked });
          await refresh();
          notice(t('savedAgents', RUNNER_LABEL[runner]), 'ok');
        });
      } else if (el.dataset.role === 'model') {
        run(async () => {
          const runner = el.dataset.runner;
          const id = el.dataset.id;
          const info = runnerState(runner);
          const list = info.models && Array.isArray(info.models.list) ? info.models.list : [];
          const all = list.map((model) => model.id);
          const current = info.selected === null ? all.slice() : (Array.isArray(info.selected) ? info.selected.slice() : []);
          const set = new Set(current);
          if (el.checked) set.add(id);
          else set.delete(id);
          await request('PUT', '/api/agents/' + encodeURIComponent(runner), { selected: Array.from(set) });
          await refresh();
          notice(t('savedSelected'), 'ok');
        });
      }
    });
    $('panel-agents').addEventListener('input', (event) => {
      const el = event.target;
      if (!el || !el.dataset || el.dataset.role !== 'search') return;
      state.search[el.dataset.runner] = el.value;
      const card = el.closest('.card');
      if (card) filterModels(card, el.value);
    });
    $('panel-agents').addEventListener('submit', (event) => {
      const form = event.target.closest('form[data-role="manual"]');
      if (!form) return;
      event.preventDefault();
      run(async () => {
        const runner = form.dataset.runner;
        const id = form.querySelector('[data-role="new-id"]').value.trim();
        const efforts = form.querySelector('[data-role="new-efforts"]').value
          .split(',').map((value) => value.trim()).filter(Boolean);
        if (!id) throw new Error(t('needModelId'));
        await request('POST', '/api/models/' + encodeURIComponent(runner), { id: id, efforts: efforts });
        await refresh();
        notice(t('added', id), 'ok');
      });
    });

    $('panel-routing').addEventListener('click', (event) => {
      const button = event.target.closest('button[data-act]');
      if (!button) return;
      const act = button.dataset.act;
      if (act === 'add-routing-step') {
        const tier = button.dataset.tier;
        const select = button.parentElement.querySelector('select[data-role="add-choice"]');
        const options = externalCombos();
        const combo = select ? options[Number(select.value)] : null;
        if (!combo) return;
        const steps = state.routing.tiers[tier];
        steps.splice(steps.length - 1, 0, { runner: combo.runner, model: combo.model, effort: combo.effort });
        renderRouting();
      } else if (act === 'up' || act === 'down') {
        moveRoutingStep(button.dataset.tier, Number(button.dataset.index), act === 'up' ? -1 : 1);
      } else if (act === 'del') {
        const steps = state.routing.tiers[button.dataset.tier];
        const index = Number(button.dataset.index);
        if (index >= 0 && index < steps.length - 1) {
          steps.splice(index, 1);
          renderRouting();
        }
      }
    });
    $('panel-routing').addEventListener('change', (event) => {
      const el = event.target;
      if (!el || !el.dataset) return;
      const role = el.dataset.role;
      if (!role || role === 'add-choice') return;
      const found = findStep('routing', el.dataset.tier, Number(el.dataset.index), null);
      if (!found) return;
      applyStepChange(found.step, role, el);
      renderRouting();
    });

    $('panel-priority').addEventListener('click', (event) => {
      const button = event.target.closest('button[data-act]');
      if (!button) return;
      const act = button.dataset.act;
      if (act === 'select-template') {
        const template = state.data.templates[button.dataset.name];
        if (!template) return;
        state.template = clone(template);
        state.templateOriginal = button.dataset.name;
        renderPriority();
      } else if (act === 'copy-example') {
        run(async () => {
          const name = button.dataset.name;
          const as = String(state.copyAs || '').trim();
          const result = await request('POST', '/api/examples/' + encodeURIComponent(name) + '/copy',
            as ? { as: as } : {});
          state.templateOriginal = result.name;
          await refresh();
          state.template = clone(state.data.templates[result.name]);
          renderPriority();
          notice(t('copied', result.name), 'ok');
        });
      } else if (act === 'save-template') {
        saveTemplate();
      } else if (act === 'delete-template') {
        const name = button.dataset.name;
        if (!window.confirm(t('confirmDelete', name))) return;
        run(async () => {
          await request('DELETE', '/api/templates/' + encodeURIComponent(name));
          if (state.templateOriginal === name) {
            state.template = null;
            state.templateOriginal = null;
          }
          await refresh();
          notice(t('templateDeleted', name), 'ok');
        });
      } else if (act === 'reset-template') {
        if (state.templateOriginal && state.data.templates[state.templateOriginal]) {
          state.template = clone(state.data.templates[state.templateOriginal]);
        } else {
          state.template = { name: '', description: '', tiers: {} };
        }
        renderPriority();
      } else if (act === 'add-template-step') {
        const tier = button.dataset.tier;
        const select = button.parentElement.querySelector('select[data-role="add-choice"]');
        const options = allCombos();
        const combo = select ? options[Number(select.value)] : null;
        if (!combo) return;
        const steps = state.template.tiers[tier];
        const at = steps.length && isObject(steps[steps.length - 1]) && steps[steps.length - 1].runner === 'agent'
          ? steps.length - 1 : steps.length;
        steps.splice(at, 0, { runner: combo.runner, model: combo.model, effort: combo.effort });
        renderPriority();
      } else if (act === 'add-rotate') {
        const tier = button.dataset.tier;
        const options = externalCombos();
        if (!options.length) { notice(t('noChoice'), 'err'); return; }
        const picks = options.length === 1 ? [options[0], options[0]] : [options[0], options[1]];
        const steps = state.template.tiers[tier];
        const at = steps.length && isObject(steps[steps.length - 1]) && steps[steps.length - 1].runner === 'agent'
          ? steps.length - 1 : steps.length;
        steps.splice(at, 0, { rotate: picks.map((combo) => ({ runner: combo.runner, model: combo.model, effort: combo.effort })) });
        renderPriority();
      } else if (act === 'add-member') {
        addMember(button.dataset.tier, Number(button.dataset.index));
      } else if (act === 'group-up' || act === 'group-down') {
        const list = state.template.tiers[button.dataset.tier];
        const index = Number(button.dataset.index);
        const to = index + (act === 'group-up' ? -1 : 1);
        if (to < 0 || to >= list.length) return;
        const item = list.splice(index, 1)[0];
        list.splice(to, 0, item);
        renderPriority();
      } else if (act === 'group-del') {
        const list = state.template.tiers[button.dataset.tier];
        const index = Number(button.dataset.index);
        if (list.length <= 1) return;
        list.splice(index, 1);
        renderPriority();
      } else if (act === 'up' || act === 'down' || act === 'del') {
        const tier = button.dataset.tier;
        const index = Number(button.dataset.index);
        const member = button.dataset.member === undefined ? null : Number(button.dataset.member);
        const list = member === null ? state.template.tiers[tier] : state.template.tiers[tier][index].rotate;
        if (!Array.isArray(list)) return;
        if (act === 'del') {
          if (member !== null && list.length <= 2) return;
          if (member === null && list.length <= 1) return;
          list.splice(member === null ? index : member, 1);
          renderPriority();
          return;
        }
        const from = member === null ? index : member;
        const to = from + (act === 'up' ? -1 : 1);
        if (to < 0 || to >= list.length) return;
        const item = list.splice(from, 1)[0];
        list.splice(to, 0, item);
        renderPriority();
      } else if (act === 'apply') {
        applyNow();
      } else if (act === 'answer-extend') {
        answer('extend');
      } else if (act === 'answer-forever') {
        answer('forever');
      } else if (act === 'answer-stop') {
        answer('stop');
      }
    });
    $('panel-priority').addEventListener('change', (event) => {
      const el = event.target;
      if (!el || !el.dataset) return;
      const role = el.dataset.role;
      if (role === 'tier-toggle') {
        if (!state.template) return;
        if (el.checked) {
          state.template.tiers[el.dataset.tier] = [{ runner: 'agent', model: defaultAgentModel(), effort: null }];
        } else {
          delete state.template.tiers[el.dataset.tier];
        }
        renderPriority();
        return;
      }
      if (role === 'app-template') { state.app.template = el.value; renderPriority(); return; }
      if (role === 'app-forever') { state.app.forever = el.checked; renderPriority(); return; }
      if (role === 'app-on-expire') { state.app.on_expire = el.value; return; }
      if (role === 'app-until') { state.app.until = el.value; return; }
      if (role === 'answer-until') { state.answerUntil = el.value; return; }
      if (role === 'add-choice') return;
      const member = el.dataset.member === undefined ? null : Number(el.dataset.member);
      const found = findStep('template', el.dataset.tier, Number(el.dataset.index), member);
      if (!found) return;
      applyStepChange(found.step, role, el);
      renderPriority();
    });
    $('panel-priority').addEventListener('input', (event) => {
      const el = event.target;
      if (!el || !el.dataset) return;
      if (el.dataset.role === 'tpl-name' && state.template) state.template.name = el.value;
      else if (el.dataset.role === 'tpl-desc' && state.template) state.template.description = el.value;
      else if (el.dataset.role === 'app-reason') state.app.reason = el.value;
    });

    $('panel-flow').addEventListener('click', (event) => {
      const button = event.target.closest('button[data-act]');
      if (!button || !state.flow) return;
      const act = button.dataset.act;
      const flow = state.flow;
      if (act === 'flow-save') { saveFlow(); return; }
      if (act === 'flow-reset') {
        if (flow.isNew) { flow.isNew = false; flow.name = null; flow.draft = null; syncFlow(); }
        else loadFlowDraft(flow.name);
        renderFlow();
        return;
      }
      if (act === 'flow-delete') {
        const name = flow.name;
        if (!window.confirm(t('flowConfirmDelete', name))) return;
        run(async () => {
          const result = await request('DELETE', '/api/workflows/' + encodeURIComponent(name));
          flow.draft = null;
          await refresh();
          notice(result.fallback === 'bundled' ? t('flowDeletedBack', name) : t('flowDeleted', name), 'ok');
        });
        return;
      }
      if (act === 'flow-copy') {
        const name = String(flow.copyAs || '').trim();
        if (!NAME_RE.test(name)) { notice(t('flowNeedName'), 'err'); return; }
        if (flowInfo().workflows[name]) { notice(t('flowExists', name), 'err'); return; }
        if (!flow.draft) return;
        flow.draft = clone(flow.draft);
        flow.draft.name = name;
        flow.name = name;
        flow.isNew = true;
        flow.copyAs = '';
        renderFlow();
        return;
      }
      if (!flow.draft) return;
      if (act === 'flow-add-gate') {
        flow.draft.gates.push({ after: 'review', components: [] });
        renderFlow();
        return;
      }
      if (act === 'flow-del-gate') {
        flow.draft.gates.splice(Number(button.dataset.index), 1);
        renderFlow();
        return;
      }
      const list = flowList(button.dataset.place || '');
      if (!list) return;
      const index = Number(button.dataset.index);
      if (act === 'flow-add') {
        const select = button.parentElement.querySelector('select[data-role="flow-add-choice"]');
        const cid = select ? select.value : '';
        if (!cid) return;
        const component = flowInfo().components[cid];
        const last = list.length ? flowInfo().components[entryId(list[list.length - 1])] : null;
        // 工程では後ろ盾を最後に保つため、後ろ盾でない部品は最後の後ろ盾の手前に入れる
        const isGate = button.dataset.place.indexOf('gate:') === 0 || button.dataset.place.indexOf('opt:') === 0;
        const at = !isGate && last && last.fallback && !(component && component.fallback) ? list.length - 1 : list.length;
        list.splice(at, 0, cid);
      } else if (act === 'flow-up' || act === 'flow-down') {
        const to = index + (act === 'flow-up' ? -1 : 1);
        if (to < 0 || to >= list.length) return;
        list.splice(to, 0, list.splice(index, 1)[0]);
      } else if (act === 'flow-del') {
        list.splice(index, 1);
      } else {
        return;
      }
      renderFlow();
    });
    $('panel-flow').addEventListener('change', (event) => {
      const el = event.target;
      if (!el || !el.dataset || !state.flow) return;
      const role = el.dataset.role;
      const flow = state.flow;
      if (role === 'flow-pick') {
        flow.isNew = false;
        loadFlowDraft(el.value);
        renderFlow();
        return;
      }
      if (!flow.draft) return;
      if (role === 'flow-when') {
        const list = flowList(el.dataset.place || '');
        const index = Number(el.dataset.index);
        if (!list || !list[index]) return;
        const cid = entryId(list[index]);
        list[index] = el.value ? { id: cid, when: el.value } : cid;
        renderFlow();
      } else if (role === 'flow-gate-after') {
        const gate = flow.draft.gates[Number(el.dataset.index)];
        if (gate) gate.after = el.value;
        renderFlow();
      } else if (role === 'flow-opt-on') {
        const stage = el.dataset.stage;
        flow.draft.optional = flow.draft.optional.filter((step) => !(isObject(step) && step.stage === stage));
        if (el.checked) flow.draft.optional.push({ stage, after: flowInfo().optional_after[stage], components: [] });
        renderFlow();
      } else if (role === 'flow-opt-after') {
        const step = optionalStep(el.dataset.stage);
        if (step) step.after = el.value;
        renderFlow();
      } else if (role === 'flow-rework') {
        flow.draft.fix.max_rework = Number(el.value);
      } else if (role === 'flow-memory') {
        flow.draft.build.external_memory = el.value;
      }
    });
    $('panel-flow').addEventListener('input', (event) => {
      const el = event.target;
      if (!el || !el.dataset || !state.flow) return;
      if (el.dataset.role === 'flow-copy-as') state.flow.copyAs = el.value;
      else if (el.dataset.role === 'flow-desc' && state.flow.draft) state.flow.draft.description[el.dataset.lang] = el.value;
    });

    window.addEventListener('hashchange', () => {
      const hash = (location.hash || '').replace(/^#/, '');
      if (TABS.indexOf(hash) >= 0 && hash !== state.tab) setTab(hash, false);
    });
  }

  async function start() {
    bind();
    renderStatic();
    setTab(initialTab(), false);
    if (!boot.token) {
      notice(t('errBoot'), 'err');
      renderAll();
      return;
    }
    try {
      await refresh();
    } catch (error) {
      notice(error.message, 'err');
    }
  }

  start();
})();
</script>
</body>
</html>
